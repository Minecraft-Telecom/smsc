[package]
name = "smsc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dashmap = "6.2.1"
futures = "0.3.32"
rusmpp = { git = "https://github.com/Rusmpp/Rusmpp.git", rev = "d0ac3f6", features = ["tokio-codec", "tracing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socket2 = { git = "https://github.com/rust-lang/socket2.git", rev = "c93d95a0140f092ca1a7102ff7834cade5f74051" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
